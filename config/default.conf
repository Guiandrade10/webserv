server {
    listen 8080;
    server_name localhost site1.test;
    root ./www/site1;
    index index.html;
    client_max_body_size 1M;
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    location / {
        allowed_methods GET;
        index index.html;
    }
    location /files {
        autoindex on;
    }
    location /noindex {
    }
    location /uploads {
        allowed_methods GET POST DELETE;
        upload_store ./www/site1/uploads;
        autoindex on;
        client_max_body_size 10M;
    }
    location /tiny {
        allowed_methods POST;
        upload_store ./www/site1/uploads;
        client_max_body_size 20;
    }
    location /cgi-bin {
        allowed_methods GET POST;
        root ./www/cgi-bin;
        index index.py;
        cgi .py /usr/bin/python3;
    }
    location /old-page {
        return 301 /about.html;
    }
    location /search {
        return 302 https://duckduckgo.com/;
    }
    location /readonly {
        allowed_methods GET;
    }
}

server {
    listen 8081;
    root ./www/site2;
}

server {
    listen 8082;
    server_name alpha.test;
    root ./www/alpha;
}
server {
    listen 8082;
    server_name beta.test;
    root ./www/beta;
}
